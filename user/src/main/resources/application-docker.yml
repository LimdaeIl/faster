server:
  port: 10001

spring:
  application:
    name: user-service
  jackson:
    mapper:
      accept-case-insensitive-enums: true

  datasource:
    url: jdbc:postgresql://localhost:5433/faster
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: faster

  jpa:
    database: postgresql
    show-sql: true
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: faster
    generate-ddl: true

  data:
    redis:
      host: localhost
      port: 6379
      username: default
      password: systempass

jwt:
  secret: your_jwt_secret_key
  access:
    expiration: 3600000   # 1시간 (밀리초)
  refresh:
    expiration: 1209600000 # 2주 (밀리초)

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-service:8761/eureka
