services:
  postgres:
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: faster
    ports:
      - "5433:5432"
    networks:
      - my_network

  redis:
    image: redis
    command: redis-server
    ports:
      - "6379:6379"
    networks:
      - my_network

  k6:
    image: grafana/k6
    volumes:
      - ./k6:/scripts
    networks:
      - my_network

networks:
  my_network:
